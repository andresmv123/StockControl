name: CI - StockControl Semana 2

on:
  push:
    branches:
      - entrega/semana2-cd
  pull_request:
    branches:
      - entrega/semana2-cd
  workflow_dispatch:

jobs:
  build:
    name: Compilar StockControl
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar calidad del codigo
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Compilar aplicacion
        run: npm run build