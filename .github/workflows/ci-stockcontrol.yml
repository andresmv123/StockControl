name: CI/CD - StockControl Semana 3

on:
  push:
    branches:
      - entrega/semana3-monitoreo
  pull_request:
    branches:
      - entrega/semana3-monitoreo
  workflow_dispatch:

jobs:
  build:
    name: Compilar StockControl
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar calidad del codigo
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Compilar aplicacion
        run: npm run build

  deploy:
    name: Desplegar StockControl en Vercel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/entrega/semana3-monitoreo'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Vercel CLI
        run: npm install --global vercel@66.6.0

      - name: Obtener configuracion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generar compilacion de produccion
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar aplicacion en Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}